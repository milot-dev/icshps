manifest_version: '1.0'
bundle:
  id: ocr_scanned_resume
  name: OCR Scanned Resume Test
  description: Image-based resume scenario for end-to-end LLM vision OCR validation.
scenario:
  id: scenario_ocr_scanned_resume
  type: ocr_scanned_resume
  expected_routing: Manual review
  tags:
  - ocr
  - scanned_pdf
  - manual_test
job:
  id: job_ai_backend_engineer_001
  title: AI Backend Engineer
  department: Engineering
  location: Local Demo
  employment_type: Full-time
candidates:
- id: candidate_ocr_001
  application_id: app_ocr_001
  name: Arta Clean
  target_job_id: job_ai_backend_engineer_001
  resume_file: resumes/candidate_ocr_001_resume.pdf
required_inputs:
  job_description: job_description.md
  skills_matrix: requirements/skills_matrix.yaml
  eeo_policy: policies/eeo_policy.yaml
  credential_rules: policies/credential_rules.yaml
  hris_master: mock_data/hris_master.yaml
optional_inputs:
  linkedin_profiles: null
  application_history: null
  credential_evidence: null
  application_volume: null
execution:
  deterministic: true
  allow_missing_optional_inputs: true
  require_human_review_for_final_decision: true
notes:
- Uses a local image-based PDF to exercise LLM vision OCR without changing existing bundles.
- All mock evidence is local. No LinkedIn, ATS, HRIS, or background-check integration
  is performed.
