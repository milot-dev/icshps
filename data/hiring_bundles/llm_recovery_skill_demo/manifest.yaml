manifest_version: '1.0'
bundle:
  id: llm_recovery_skill_demo
  name: LLM Recovery Skill Demo
  description: Minimal low-confidence resume designed to show LLM-assisted extraction
    adding an evidence-backed skill without changing deterministic fallback behavior.
scenario:
  id: scenario_llm_recovery_skill_demo
  type: llm_recovery_skill_demo
  expected_routing: Manual review
  tags:
  - v2
  - llm_recovery
  - low_confidence
job:
  id: job_ai_backend_engineer_001
  title: AI Backend Engineer
  department: Engineering
  location: Local Demo
  employment_type: Full-time
candidates:
- id: candidate_llm_skill_001
  application_id: app_llm_skill_001
  name: Jane Recovery
  target_job_id: job_ai_backend_engineer_001
  resume_file: resumes/candidate_llm_skill_001_resume.pdf
required_inputs:
  job_description: job_description.md
  skills_matrix: requirements/skills_matrix.yaml
  eeo_policy: policies/eeo_policy.yaml
  credential_rules: policies/credential_rules.yaml
  hris_master: mock_data/hris_master.yaml
optional_inputs:
  linkedin_profiles: null
  application_history: null
  credential_evidence: null
  application_volume: null
execution:
  deterministic: true
  allow_missing_optional_inputs: true
  require_human_review_for_final_decision: true
notes:
- Demo bundle for verifying optional LLM recovery with LangChain.
- The resume intentionally omits email and phone, and includes Kubernetes as an
  exact source snippet that deterministic extraction does not list as a built-in
  skill keyword.
