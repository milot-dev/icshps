[project]
name = "icshps"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Milot Hyseni", email = "milothysni@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.7",
    "langchain-openai>=1.1.3",
    "langgraph>=1.2.4",
    "google-api-python-client>=2.187.0",
    "google-auth>=2.43.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "streamlit>=1.58.0",
]

[project.scripts]
icshps = "icshps:main"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
